<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#050c14;
color:white;
min-height:100vh;
}

header{
height:70px;
background:#081421;
border-bottom:1px solid #19364e;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%;
}

.logo{

}

.logo span{

}

.auth{

gap:8px;
align-items:center;
}

.login{
color:white;
text-decoration:none;
font-size:12px;
padding:9px 12px;
}

.signup{
background:#159ff0;
color:white;
text-decoration:none;
padding:10px 14px;
border-radius:7px;
font-size:12px;

}

.page{
max-width:1400px;
margin:auto;
padding:28px 5%;
}

.heading{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.heading h1{
font-size:30px;
}

.heading p{
color:#71889b;

margin-top:6px;
}

.connection{
display:flex;
align-items:center;
gap:8px;
font-size:11px;
color:#8da2b3;
}

.dot{
width:8px;
height:8px;
border-radius:50%;
background:#f0b429;

.dot.live{
background:#2edb9c;
box-shadow:0 0 10px #2edb9c;
}

.dot.error{

}

.layout{
display:grid;

gap:18px;

.sidebar{
background:#081421;
border:1px solid #19364e;
border-radius:12px;
overflow:hidden;
}

.sidebar-title{
padding:16px;
font-size:10px;
font-weight:bold;
color:#70899b;
letter-spacing:1px;
border-bottom:1px solid #19364e;
}

.market{
display:block;
width:100%;
background:transparent;
border:0;
border-bottom:1px solid #142b3d;
color:white;
padding:15px;
text-align:left;
cursor:pointer;
}

.market:hover{
background:#0c2030;
}

.market.active{
background:#0c2940;
border-left:3px solid #159ff0;
padding-left:12px;
}

.market-name{
font-size:12px;
font-weight:bold;
display:block;
}

.market-symbol{
font-size:10px;
color:#637b8d;
display:block;
margin-top:5px;
}

.market-price{
float:right;
margin-top:-28px;
font-size:11px;
color:#9db2c0;
}

.panel{
background:#081421;
border:1px solid #19364e;
border-radius:12px;
overflow:hidden;
}

.panel-head{
padding:18px;
border-bottom:1px solid #19364e;
display:flex;
justify-content:space-between;
align-items:center;
}

.selected-name{
font-size:16px;
font-weight:bold;
}

.selected-symbol{
font-size:10px;
color:#6f8799;
margin-top:5px;
}

.live{
font-size:10px;
color:#2edb9c;
}

.price-box{
padding:20px;
background:#060e17;
border-bottom:1px solid #19364e;
}

.label{
font-size:9px;
color:#657d90;
margin-bottom:7px;
}

.price{
font-size:34px;
font-weight:bold;
}

.message{
font-size:11px;
color:#71889b;
margin-top:6px;
}

.chart{
height:450px;
background:
linear-gradient(rgba(30,65,90,.15) 1px,transparent 1px),
linear-gradient(90deg,rgba(30,65,90,.15) 1px,transparent 1px),
#050d16;
background-size:45px 45px;
position:relative;
}

canvas{
width:100%;
height:100%;
display:block;
}

.chart-status{
position:absolute;
top:12px;
left:12px;
background:rgba(5,13,22,.9);
border:1px solid #1c3c54;
border-radius:5px;
padding:7px 9px;
font-size:9px;
color:#7890a2;
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
border-top:1px solid #19364e;
}

.info-box{
padding:16px;
border-right:1px solid #19364e;
}

.info-label{
font-size:9px;
color:#617a8d;
margin-bottom:6px;
}

.info-value{
font-size:13px;
font-weight:bold;
}

.error{
display:none;
margin-top:12px;
padding:14px;
border-radius:7px;
background:#28151a;
border:1px solid #67303a;
color:#ff7a86;
font-size:11px;
}

@media(max-width:800px){

.layout{
grid-template-columns:1fr;
}

.sidebar{
display:grid;
grid-template-columns:repeat(2,1fr);
}

.sidebar-title{
grid-column:1/-1;
}

.heading{
align-items:flex-start;
gap:15px;
flex-direction:column;
}

}

@media(max-width:500px){

.page{
padding:20px 4%;
}

.chart{
height:350px;
}

.info{
grid-template-columns:1fr;
}

.info-box{
border-right:0;
border-bottom:1px solid #19364e;
}

}

</style>

</head>

<script>


/*
============================================
NEXTRADE BACKEND
============================================
*/

const BACKEND =
"wss://nextrade-backened.onrender.com";


let socket;

let selectedSymbol =
"1HZ100V";

let selectedName =
"Volatility 100 (1s)";

let tickCount =
0;

let prices = [];


/*
ELEMENTS
*/

const connection =
document.getElementById(
"connection"
);

const dot =
document.getElementById(
"dot"
);

const livePrice =
document.getElementById(
"livePrice"
);

const message =
document.getElementById(
"message"
);

const backendStatus =
document.getElementById(
"backendStatus"
);

const tickCounter =
document.getElementById(
"tickCount"
);

const chartStatus =
document.getElementById(
"chartStatus"
);

const error =
document.getElementById(
"error"
);

const canvas =
document.getElementById(
"canvas"
);

const ctx =
canvas.getContext(
"2d"
);


/*
============================================
CONNECT TO RENDER
============================================
*/

function connect(){

connection.textContent =
"CONNECTING";

dot.className =
"dot";

backendStatus.textContent =
"Connecting...";

chartStatus.textContent =
"Connecting to NEXTRADE backend...";


socket =
new WebSocket(
BACKEND
);


socket.onopen =
function(){

connection.textContent =
"CONNECTED";

dot.className =
"dot live";

backendStatus.textContent =
"Connected";

chartStatus.textContent =
"Waiting for live ticks...";

message.textContent =
"Connected to NEXTRADE live data";

hideError();

};


socket.onmessage =
function(event){

let response;

try{

response =
JSON.parse(
event.data
);

}

catch(e){

return;

}


/*
STATUS
*/

if(
response.type ===
"status"
){

if(response.connected){

backendStatus.textContent =
"Deriv connected";

}

else{

backendStatus.textContent =
"Waiting for Deriv";

}

return;

}


/*
TICK
*/

if(
response.type ===
"tick"
){

const tick =
response.data;

if(!tick){

return;

}


/*
UPDATE SIDEBAR
*/

const smallPrice =
document.getElementById(
"price-" +
tick.symbol
);

if(smallPrice){

smallPrice.textContent =
formatPrice(
tick.price
);

}


/*
ONLY UPDATE MAIN
FOR SELECTED MARKET
*/

if(
tick.symbol !==
selectedSymbol
){

return;

}


tickCount++;

tickCounter.textContent =
tickCount;


livePrice.textContent =
formatPrice(
tick.price
);


message.textContent =
"Live market data received";


chartStatus.textContent =
"LIVE • REAL-TIME TICKS";


prices.push(
tick.price
);


if(
prices.length >
80
){

prices.shift();

}


drawChart();

}

};


socket.onerror =
function(){

connection.textContent =
"CONNECTION ERROR";

dot.className =
"dot error";

backendStatus.textContent =
"Connection error";

showError(
"Could not connect to the NEXTRADE backend."
);

};


socket.onclose =
function(){

connection.textContent =
"DISCONNECTED";

dot.className =
"dot error";

backendStatus.textContent =
"Reconnecting...";

chartStatus.textContent =
"Backend disconnected — reconnecting...";


setTimeout(
connect,
4000
);

};

}


/*
============================================
MARKET SELECTION
============================================
*/

document
.querySelectorAll(
".market"
)
.forEach(
button => {

button.addEventListener(
"click",
function(){

document
.querySelectorAll(
".market"
)
.forEach(
b =>
b.classList.remove(
"active"
)
);


this.classList.add(
"active"
);


selectedSymbol =
this.dataset.symbol;

selectedName =
this.dataset.name;


document
.getElementById(
"selectedName"
)
.textContent =
selectedName;


document
.getElementById(
"selectedSymbol"
)
.textContent =
selectedSymbol;


document
.getElementById(
"infoMarket"
)
.textContent =
selectedName;


tickCount =
0;

tickCounter.textContent =
"0";

livePrice.textContent =
"---";

prices =
[];


message.textContent =
"Waiting for " +
selectedName +
" live data...";


chartStatus.textContent =
"Waiting for live ticks...";


drawChart();

}
);

}
);


/*
============================================
PRICE FORMAT
============================================
*/

function formatPrice(
value
){

return Number(value)
.toLocaleString(
undefined,
{
minimumFractionDigits:2,
maximumFractionDigits:8
}
);

}


/*
============================================
CHART
============================================
*/

function drawChart(){

const width =
canvas.clientWidth;

const height =
canvas.clientHeight;


canvas.width =
width *
window.devicePixelRatio;

canvas.height =
height *
window.devicePixelRatio;


ctx.setTransform(
window.devicePixelRatio,
0,
0,
window.devicePixelRatio,
0,
0
);


ctx.clearRect(
0,
0,
width,
height
);


if(
prices.length <
2
){

ctx.fillStyle =
"#60788a";

ctx.font =
"12px Arial";

ctx.textAlign =
"center";

ctx.fillText(
"Waiting for live ticks...",
width/2,
height/2
);

return;

}


let min =
Math.min(
...prices
);

let max =
Math.max(
...prices
);


if(
max === min
){

max += 1;

min -= 1;

}


const padding =
25;


ctx.beginPath();


prices.forEach(
(price,index) => {

const x =
padding +
(
index /
(prices.length-1)
) *
(
width -
padding*2
);


const y =
height -
padding -
(
(price-min) /
(max-min)
) *
(
height -
padding*2
);


if(index === 0){

ctx.moveTo(
x,
y
);

}

else{

ctx.lineTo(
x,
y
);

}

}
);


ctx.strokeStyle =
"#159ff0";

ctx.lineWidth =
2;

ctx.stroke();

}


/*
============================================
ERROR
============================================
*/

function showError(
text
){

error.style.display =
"block";

error.textContent =
text;

}


function hideError(){

error.style.display =
"none";

}


/*
============================================
START
============================================
*/

window.addEventListener(
"resize",
drawChart
);

drawChart();

connect();

</script>
