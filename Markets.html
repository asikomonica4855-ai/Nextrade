<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexTrade Markets</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:#fff;
}

header{
    background:linear-gradient(135deg,#0066ff,#003b99);
    padding:25px 18px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:32px;
}

header p{
    margin:8px 0 0;
    color:#dbeafe;
}

nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    background:#0d1726;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:8px;
}

nav a:hover{
    background:#0066ff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.section-title{
    margin-top:10px;
    font-size:25px;
}

.market-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.card{
    background:#111d2d;
    border:1px solid #20324a;
    border-radius:15px;
    padding:18px;
    margin-bottom:20px;
}

.market-card{
    cursor:pointer;
    transition:.2s;
}

.market-card:hover{
    transform:translateY(-3px);
    border-color:#1683ff;
}

.market-card h3{
    margin-top:0;
}

.price{
    font-size:25px;
    font-weight:bold;
}

.up{
    color:#22c55e;
}

.down{
    color:#ef4444;
}

.chart{
    height:300px;
    position:relative;
    overflow:hidden;
    background:#091522;
    border-radius:12px;
    border:1px solid #26384e;
}

.line{
    position:absolute;
    left:0;
    right:0;
    bottom:35px;
    height:150px;
}

svg{
    width:100%;
    height:100%;
}

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:15px;
}

button{
    border:0;
    background:#0066ff;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#0050c7;
}

button.active{
    background:#22c55e;
}

.signal{
    border-left:4px solid #22c55e;
    padding:12px;
    background:#0b1928;
    border-radius:8px;
    margin:10px 0;
}

.signal.sell{
    border-left-color:#ef4444;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#17304e;
    font-size:12px;
}

.trade-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:7px;
    background:#091522;
    color:white;
    border:1px solid #30445c;
    border-radius:8px;
}

footer{
    text-align:center;
    padding:25px;
    color:#8293a8;
}

@media(max-width:600px){
    .trade-box{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<header>
    <h1>NexTrade</h1>
    <p>Trade Smarter • Analyze Better • Execute With Confidence</p>

<nav>

    <a href="#analysis">Market Analysis</a>
    <a href="#signals">Signals</a>
    <a href="#manual">Manual Trading</a>
</nav>

    </div>
