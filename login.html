<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MUKHU | Login</title><style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#040a10;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.login-box{
width:100%;
max-width:430px;
background:#08131f;
border:1px solid #193247;
border-radius:16px;
padding:35px;
box-shadow:0 25px 70px rgba(0,0,0,.5);
}

.logo{
text-align:center;
font-size:30px;
font-weight:900;
margin-bottom:8px;
}

.logo span{color:#159ff0}

.subtitle{
text-align:center;
color:#71899a;
font-size:11px;
margin-bottom:30px;
}

.deriv-button{
width:100%;
border:0;
border-radius:9px;
padding:15px;
background:#159ff0;
color:#fff;
font-size:11px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

.deriv-button:hover{
background:#078bdc;
transform:translateY(-1px);
}

.status{
display:none;
margin-top:18px;
padding:12px;
border-radius:8px;
font-size:9px;
text-align:center;
line-height:1.5;
}

.status.show{display:block}

.status.error{
background:#241116;
border:1px solid #6b2734;
color:#ff7887;
}

.status.info{
background:#0b1d2b;
border:1px solid #1b4865;
color:#7dcaff;
}

.secure{
margin-top:25px;
padding-top:20px;
border-top:1px solid #193247;
text-align:center;
font-size:8px;
line-height:1.6;
color:#526d7f;
}

.back{
display:block;
text-align:center;
margin-top:20px;
color:#71899a;
font-size:9px;
text-decoration:none;
}

.back:hover{color:#159ff0}
</style></head><body><div class="login-box"><div class="logo">
MUK<span>HU</span>
</div><div class="subtitle">
Connect your trading account securely
</div><button
id="loginButton"
class="deriv-button">
CONNECT ACCOUNT
</button>

<div
id="status"
class="status">
</div><div class="secure">
You will be redirected to the secure account
authorization page. MUKHU does not ask you to
enter your trading password directly on this page.
</div><a href="index.html" class="back">
← BACK TO HOME
</a></div><script>

const BACKEND =
"https://nextrade-backened.onrender.com";

const loginButton =
document.getElementById("loginButton");

const statusBox =
document.getElementById("status");

function showStatus(text,type){

statusBox.textContent=text;

statusBox.className=
"status show "+type;

}

function checkOAuthError(){

const params=
new URLSearchParams(
window.location.search
);

const error=
params.get("oauth_error");

if(!error)return;

let text=
"Account authorization failed.";

if(error==="token_exchange_failed"){
text="Authorization could not be completed. Please try again.";
}

if(error==="missing_access_token"){
text="No account access token was received.";
}

if(error==="oauth_callback_failed"){
text="The account connection failed. Please try again.";
}

if(error==="access_denied"){
text="Account authorization was cancelled.";
}

showStatus(text,"error");

}

loginButton.addEventListener(
"click",
()=>{

showStatus(
"Opening secure account authorization...",
"info"
);

loginButton.disabled=true;
loginButton.textContent=
"CONNECTING...";

window.location.href=
BACKEND+
"/oauth/authorize";

});

checkOAuthError();

</script></body>
</html>
