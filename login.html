<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MUKHU | Login</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:Arial,sans-serif;
background:#040a10;
color:#fff;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}
.login{
width:100%;
max-width:420px;
background:#08131f;
border:1px solid #193247;
border-radius:16px;
padding:35px;
box-shadow:0 25px 70px #0009;
}
.logo{
text-align:center;
font-size:28px;
font-weight:900;
margin-bottom:8px;
}
.logo span{color:#159ff0}
.subtitle{
text-align:center;
color:#71899a;
font-size:10px;
margin-bottom:30px;
}
label{
display:block;
font-size:8px;
font-weight:bold;
color:#8ca2b1;
margin:15px 0 7px;
}
input{
width:100%;
padding:13px;
border-radius:7px;
border:1px solid #193247;
background:#07111b;
color:#fff;
outline:none;
font-size:11px;
}
input:focus{border-color:#159ff0}
button{
width:100%;
margin-top:22px;
padding:14px;
border:0;
border-radius:7px;
background:#159ff0;
color:#fff;
font-weight:bold;
font-size:10px;
cursor:pointer;
}
button:hover{filter:brightness(1.12)}
.status{
margin-top:15px;
padding:10px;
border-radius:7px;
background:#07111b;
border:1px solid #193247;
color:#71899a;
font-size:8px;
text-align:center;
display:none;
}
.links{
margin-top:22px;
text-align:center;
font-size:9px;
color:#71899a;
}
.links a{
color:#159ff0;
text-decoration:none;
}
.back{
display:block;
text-align:center;
margin-top:20px;
color:#71899a;
font-size:8px;
text-decoration:none;
}
.back:hover{color:#fff}
</style></head><body><div class="login"><div class="logo">MU<span>KHU</span></div><div class="subtitle">
SIGN IN TO YOUR MUKHU ACCOUNT
</div><form id="loginForm"><label>EMAIL</label>
<input
id="email"
type="email"
placeholder="Enter your email"
required

«»

<label>PASSWORD</label>
<input
id="password"
type="password"
placeholder="Enter your password"
required

«»

<button type="submit">LOGIN</button>

<div id="status" class="status"></div></form><div class="links">
Don't have an account?
<a href="signup.html">SIGN UP</a>
</div><a class="back" href="index.html">
← BACK TO MUKHU
</a></div><script>
const form=document.getElementById("loginForm");
const status=document.getElementById("status");

form.addEventListener("submit",async e=>{
e.preventDefault();

status.style.display="block";
status.textContent="Connecting...";

try{
/*
Connect this form to the same backend
used by the rest of MUKHU.
*/
const response=await fetch(
"https://nextrade-backened.onrender.com/api/login",
{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:document.getElementById("email").value,
password:document.getElementById("password").value
})
});

const data=await response.json();

if(!response.ok){
throw new Error(data.error||"Login failed");
}

if(data.sessionToken){
localStorage.setItem(
"mukhu_session_token",
data.sessionToken
);
}

status.textContent="Login successful. Redirecting...";
status.style.color="#2edb9c";

setTimeout(()=>{
window.location.href="markets.html";
},700);

}catch(error){
console.error(error);
status.textContent=error.message||"Unable to login.";
status.style.color="#ff6575";
}
});
</script></body>
</html>
