<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXTRADE | Connection Test</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,sans-serif;
background:#07111f;
color:white;
min-height:100vh;
padding:25px;
}

.container{
max-width:700px;
margin:auto;
}

.logo{
color:#35a7ff;
font-size:25px;
font-weight:bold;
margin-bottom:25px;
}

.card{
background:#0d1b2d;
border:1px solid #1c3550;
border-radius:12px;
padding:25px;
margin-bottom:20px;
}

h1{
color:#35a7ff;
margin-bottom:10px;
}

p{
color:#9fb1c7;
line-height:1.6;
margin-bottom:15px;
}

.status{
padding:15px;
border-radius:8px;
background:#102238;
margin-bottom:15px;
font-weight:bold;
}

.live{
color:#58d68d;
}

.error{
color:#ff7777;
}

.data{
background:#07111f;
padding:15px;
border-radius:8px;
font-size:20px;
letter-spacing:3px;
word-break:break-word;
min-height:55px;
}

.info{
margin-top:15px;
font-size:13px;
color:#9fb1c7;
line-height:1.6;
}

button{
margin-top:20px;
padding:12px 20px;
border:0;
border-radius:7px;
background:#35a7ff;
font-weight:bold;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">
NEXTRADE
</div>

<div class="card">

<h1>Deriv Connection Test</h1>

<p>
Testing public live data from Volatility 100 (1s).
</p>

<div id="status" class="status">
Connecting...
</div>

<div class="data" id="data">
Waiting for tick data...
</div>

<div class="info" id="info">
Symbol: 1HZ100V<br>
Ticks received: 0
</div>

<button onclick="connect()">
Reconnect
</button>

</div>

</div>


<script>

let ws=null;
let tickCount=0;
let reconnectTimer=null;

const status=
document.getElementById("status");

const data=
document.getElementById("data");

const info=
document.getElementById("info");


function setStatus(text,type){

status.textContent=text;

status.className=
"status "+(type||"");

}


function connect(){

clearTimeout(reconnectTimer);

if(ws){

try{
ws.close();
}catch(e){}

}

tickCount=0;

setStatus(
"Connecting to Deriv..."
);

data.textContent=
"Waiting for tick data...";

info.innerHTML=
"Symbol: 1HZ100V<br>"+
"Ticks received: 0";


/*
Use Deriv's public WebSocket endpoint.
No account login or token is used.
*/

ws=new WebSocket(
"wss://ws.binaryws.com/websockets/v3"
);


ws.onopen=function(){

setStatus(
"CONNECTED — requesting live ticks",
"live"
);

ws.send(JSON.stringify({

ticks:"1HZ100V",
subscribe:1,
req_id:1001

}));

};


ws.onmessage=function(event){

let response;

try{

response=
JSON.parse(event.data);

}catch(error){

return;

}


/*
Display API errors clearly.
*/

if(response.error){

setStatus(
"DERIV ERROR: "+
response.error.message,
"error"
);

return;

}


/*
Live tick received.
*/

if(response.msg_type==="tick"){

tickCount++;

let quote=
response.tick.quote;

let symbol=
response.tick.symbol;

let epoch=
response.tick.epoch;

data.textContent=
String(quote);

info.innerHTML=
"Symbol: "+
symbol+
"<br>"+
"Ticks received: "+
tickCount+
"<br>"+
"Last update: "+
new Date(
epoch*1000
).toLocaleTimeString();


setStatus(
"LIVE CONNECTION WORKING",
"live"
);

}

};


ws.onerror=function(){

setStatus(
"WEBSOCKET ERROR",
"error"
);

};


ws.onclose=function(){

setStatus(
"Connection closed — reconnecting...",
"error"
);

reconnectTimer=
setTimeout(
connect,
5000
);

};

}


connect();

</script>

</body>
</html>
