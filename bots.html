<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUKHU | Bots</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#040a10;color:#fff;font-family:Arial}
header{padding:18px 5%;background:#08131f;border-bottom:1px solid #193247}
.logo{font-size:22px;font-weight:900}.logo span{color:#159ff0}
main{max-width:900px;margin:auto;padding:40px 5%}
h1{font-size:30px}.sub{color:#71899a;font-size:11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:30px}
.card{background:#08131f;border:1px solid #193247;border-radius:12px;padding:25px}
.card h2{font-size:17px}.signal{font-size:28px;font-weight:900;margin:20px 0;color:#2edb9c}
button{width:100%;padding:13px;border:0;border-radius:7px;background:#159ff0;color:#fff;font-weight:bold}
.result{margin-top:12px;color:#71899a;font-size:10px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><header>
<div class="logo">MU<span>KHU</span></div>
</header><main>
<h1>Simple Bots</h1>
<p class="sub">Basic Over 2 and Under 7 signal tools.</p><div class="grid"><div class="card">
<h2>OVER 2</h2>
<div class="signal">OVER 2</div>
<button onclick="signal('over')">GENERATE SIGNAL</button>
<div id="over" class="result">Ready</div>
</div><div class="card">
<h2>UNDER 7</h2>
<div class="signal">UNDER 7</div>
<button onclick="signal('under')">GENERATE SIGNAL</button>
<div id="under" class="result">Ready</div>
</div></div>
</main><script>
function signal(type){
const ok=Math.random()>0.35;
const el=document.getElementById(type);
el.textContent=ok
?"SIGNAL ACTIVE • CHECK MARKET"
:"WAIT • NO ENTRY";
}
</script></body>
</html>
