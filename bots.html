<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NEXTRADE | Trading Bots</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Helvetica,sans-serif;
background:#040a10;
color:#fff;
min-height:100vh
}

header{
min-height:70px;
background:#08131f;
border-bottom:1px solid #193247;
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 5%;
gap:15px
}

.logo{
font-size:24px;
font-weight:900;
white-space:nowrap
}

.logo span{color:#159ff0}

nav{
display:flex;
gap:3px;
overflow-x:auto
}

nav a{
color:#8097a8;
text-decoration:none;
font-size:9px;
font-weight:bold;
padding:9px;
white-space:nowrap;
border-radius:6px
}

nav a:hover,
nav a.active{
color:#159ff0;
background:#102333
}

main{
max-width:1250px;
margin:auto;
padding:32px 5%
}

.top{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;
margin-bottom:22px
}

h1{
font-size:30px;
margin-bottom:8px
}

.subtitle{
font-size:10px;
line-height:1.6;
color:#71899a;
max-width:700px
}

.live-status{
display:flex;
align-items:center;
gap:7px;
border:1px solid #193247;
border-radius:20px;
padding:8px 12px;
font-size:8px;
color:#71899a;
white-space:nowrap
}

.live-dot{
width:7px;
height:7px;
border-radius:50%;
background:#71899a
}

.live-dot.on{
background:#2edb9c;
box-shadow:0 0 9px #2edb9c
}

.layout{
display:grid;
grid-template-columns:230px 1fr 270px;
gap:14px
}

.card{
background:#08131f;
border:1px solid #193247;
border-radius:10px;
padding:16px
}

.card-title{
font-size:11px;
font-weight:bold;
margin-bottom:14px;
display:flex;
justify-content:space-between;
align-items:center
}

.card-title span{
font-size:7px;
color:#60788a
}

/* MARKETS */

.market-list{
display:flex;
flex-direction:column;
gap:6px
}

.market{
padding:10px;
border:1px solid #193247;
border-radius:7px;
background:#07111b;
cursor:pointer
}

.market.active{
border-color:#159ff0;
background:#0b1d2c
}

.market-name{
font-size:8px;
font-weight:bold
}

.market-code{
font-size:6px;
color:#60788a;
margin-top:3px
}

.market-price{
font-size:10px;
margin-top:5px
}

/* CENTER */

.market-head{
display:flex;
justify-content:space-between;
align-items:flex-start
}

.selected-name{
font-size:14px;
font-weight:bold
}

.price{
font-size:28px;
font-weight:900;
margin-top:8px
}

.price-change{
font-size:8px;
color:#60788a;
margin-top:5px
}

.chart{
height:220px;
margin-top:18px;
border:1px solid #193247;
border-radius:8px;
background:
linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
#06101a;
background-size:25px 25px;
position:relative;
overflow:hidden
}

.chart-label{
position:absolute;
top:10px;
left:12px;
font-size:7px;
color:#60788a;
z-index:2
}

.chart-line{
position:absolute;
left:0;
right:0;
top:50%;
height:2px;
background:#159ff0;
transform-origin:center;
opacity:.7
}

.pointer{
position:absolute;
right:18px;
top:50%;
width:10px;
height:10px;
border-radius:50%;
background:#2edb9c;
box-shadow:0 0 14px #2edb9c;
transform:translateY(-50%);
transition:top .15s
}

.tick-strip{
display:grid;
grid-template-columns:repeat(6,1fr);
gap:5px;
margin-top:8px
}

.tick{
background:#07111b;
border:1px solid #193247;
border-radius:6px;
padding:7px;
text-align:center
}

.tick small{
display:block;
font-size:5px;
color:#60788a
}

.tick strong{
display:block;
font-size:8px;
margin-top:4px
}

/* BOT */

.bot-panel{
margin-top:12px
}

.field{
margin-bottom:12px
}

label{
display:block;
font-size:7px;
font-weight:bold;
color:#8da3b1;
margin-bottom:6px
}

select,
input{
width:100%;
height:40px;
background:#07111b;
border:1px solid #29465a;
border-radius:6px;
color:#fff;
padding:0 10px;
font-size:9px;
outline:none
}

select:focus,
input:focus{
border-color:#159ff0
}

.start{
width:100%;
height:42px;
border:0;
border-radius:6px;
background:#159ff0;
color:#fff;
font-size:9px;
font-weight:bold;
cursor:pointer
}

.stop{
width:100%;
height:40px;
margin-top:7px;
border:1px solid #61313a;
border-radius:6px;
background:#190d11;
color:#ff6878;
font-size:8px;
font-weight:bold;
cursor:pointer
}

.stop:disabled{
opacity:.35
}

.notice{
margin-top:12px;
padding:9px;
border-radius:6px;
background:#07111b;
border:1px solid #193247;
font-size:7px;
line-height:1.6;
color:#71899a
}

/* SIGNAL */

.signal-box{
margin-top:12px;
padding:25px 15px;
border:1px solid #193247;
border-radius:9px;
background:
radial-gradient(circle,rgba(21,159,240,.09),transparent 60%),
#07111b;
text-align:center
}

.signal-label{
font-size:7px;
letter-spacing:2px;
color:#60788a
}

.signal{
font-size:32px;
font-weight:900;
margin-top:9px
}

.signal.buy{color:#2edb9c}
.signal.wait{color:#f0b84b}

.confidence{
font-size:9px;
color:#71899a;
margin-top:7px
}

.bar{
height:6px;
background:#142433;
border-radius:10px;
overflow:hidden;
margin-top:13px
}

.bar-fill{
height:100%;
width:0;
background:#159ff0;
transition:width .3s
}

/* DIGITS */

.digits{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px
}

.digit{
height:45px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
background:#07111b;
border:1px solid #193247;
border-radius:50%;
font-size:11px;
font-weight:bold
}

.digit span{
font-size:6px;
color:#60788a;
margin-top:3px
}

.digit.strong{
border-color:#
