<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTRADE | Connection Test</title>

<style>
body{
font-family:Arial,sans-serif;
background:#07111f;
color:white;
margin:0;
padding:25px;
}

.container{
max-width:700px;
margin:auto;
}

.logo{
font-size:25px;
font-weight:bold;
color:#35a7ff;
margin-bottom:25px;
}

.card{
background:#0d1b2d;
border:1px solid #1c3550;
border-radius:12px;
padding:25px;
}

h1{
color:#35a7ff;
}

.status{
padding:15px;
margin:20px 0;
border-radius:8px;
background:#102238;
font-weight:bold;
}

.ok{
color:#58d68d;
}

.bad{
color:#ff7777;
}

.info{
color:#9fb1c7;
line-height:1.7;
font-size:14px;
}

button{
margin-top:20px;
padding:12px 20px;
border:0;
border-radius:7px;
background:#35a7ff;
font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">NEXTRADE</div>

<div class="card">

<h1>Deriv WebSocket Test</h1>

<p class="info">
Testing whether NEXTRADE can establish a public
connection to Deriv.
</p>

<div id="status" class="status">
Testing connection...
</div>

<div id="details" class="info">
Waiting for Deriv response...
</div>

<button onclick="testConnection()">
Test Again
</button>

</div>

</div>

<script>

let socket=null;

function showStatus(text,good){

const status=
document.getElementById("status");

status.textContent=text;

status.className=
"status "+(good?"ok":"bad");

}

function testConnection(){

if(socket){

try{
socket.close();
}catch(e){}

}

showStatus(
"Opening WebSocket...",
false
);

document.getElementById(
"details"
).innerHTML=
"Connecting to Deriv public API...";


socket=new WebSocket(
"wss://ws.binaryws.com/websockets/v3"
);


socket.onopen=function(){

showStatus(
"WEBSOCKET CONNECTED",
true
);

document.getElementById(
"details"
).innerHTML=
"Connection established successfully.<br><br>"+
"Sending public ping request...";


socket.send(JSON.stringify({

ping:1,
req_id:999

}));

};


socket.onmessage=function(event){

let data;

try{

data=JSON.parse(event.data);

}catch(e){

showStatus(
"CONNECTED — INVALID RESPONSE",
false
);

return;

}


if(data.error){

showStatus(
"DERIV RETURNED AN ERROR",
false
);

document.getElementById(
"details"
).innerHTML=
"Error: "+
data.error.message;

return;

}


if(data.msg_type==="ping"){

showStatus(
"SUCCESS — DERIV CONNECTION WORKS",
true
);

document.getElementById(
"details"
).innerHTML=
"Deriv accepted the public ping request.<br><br>"+
"WebSocket connection is working.<br>"+
"No Deriv account or API token was used.";

}

};


socket.onerror=function(){

showStatus(
"WEBSOCKET ERROR",
false
);

document.getElementById(
"details"
).innerHTML=
"The browser could not establish a WebSocket connection.";

};


socket.onclose=function(){

/*
Don't overwrite a successful ping message.
*/

if(
!document.getElementById(
"status"
).textContent.includes("SUCCESS")
){

showStatus(
"CONNECTION CLOSED",
false
);

document.getElementById(
"details"
).innerHTML=
"Deriv closed the WebSocket before "+
"a successful response was received.";

}

};

}

testConnection();

</script>

</body>
</html>
