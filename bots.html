<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTRADE | Live Connection</title>

<style>
body{
  margin:0;
  padding:25px;
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
}

.logo{
  color:#35a7ff;
  font-size:25px;
  font-weight:bold;
  margin-bottom:25px;
}

.card{
  background:#0d1b2d;
  border:1px solid #1c3550;
  border-radius:12px;
  padding:25px;
}

h1{
  color:#35a7ff;
}

.status{
  padding:15px;
  margin:20px 0;
  border-radius:8px;
  background:#102238;
  font-weight:bold;
}

.good{
  color:#58d68d;
}

.bad{
  color:#ff7777;
}

.data{
  background:#07111f;
  padding:15px;
  border-radius:8px;
  font-size:20px;
  min-height:45px;
}

.info{
  margin-top:15px;
  color:#9fb1c7;
  line-height:1.7;
  font-size:14px;
}

button{
  margin-top:20px;
  padding:12px 20px;
  border:0;
  border-radius:7px;
  background:#35a7ff;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<div class="logo">NEXTRADE</div>

<div class="card">

<h1>Live Connection Test</h1>

<div id="status" class="status">
Connecting...
</div>

<div class="data" id="data">
Waiting for live data...
</div>

<div class="info" id="info">
Symbol: 1HZ100V<br>
Ticks received: 0
</div>

<button onclick="connect()">
Reconnect
</button>

</div>

</div>

<script>

let ws = null;
let ticksReceived = 0;

const status =
document.getElementById("status");

const data =
document.getElementById("data");

const info =
document.getElementById("info");


function showStatus(message, good){

  status.textContent = message;

  status.className =
    "status " + (good ? "good" : "bad");

}


function connect(){

  ticksReceived = 0;

  if(ws){

    try{
      ws.close();
    }catch(e){}

  }

  showStatus(
    "Opening current Deriv connection...",
    false
  );

  data.textContent =
    "Waiting for live data...";

  info.innerHTML =
    "Symbol: 1HZ100V<br>" +
    "Ticks received: 0";


  /*
   Current public Deriv endpoint.
   No account or API token is used.
  */

  ws = new WebSocket(
    "wss://api.derivws.com/trading/v1/options/ws/public"
  );


  ws.onopen = function(){

    showStatus(
      "CONNECTED — requesting market data",
      true
    );


    /*
     Current public API request.
     */

    ws.send(JSON.stringify({

      ticks: "1HZ100V",
      subscribe: 1

    }));

  };


  ws.onmessage = function(event){

    let response;

    try{

      response =
        JSON.parse(event.data);

    }catch(error){

      return;

    }


    /*
     Display any API error.
    */

    if(response.error){

      showStatus(
        "DERIV ERROR",
        false
      );

      info.innerHTML =
        response.error.message ||
        "Unknown Deriv error.";

      return;

    }


    /*
     Live tick.
    */

    if(response.msg_type === "tick"){

      ticksReceived++;

      let quote =
        response.tick.quote;

      let symbol =
        response.tick.symbol;

      data.textContent =
        String(quote);

      info.innerHTML =
        "Symbol: " +
        symbol +
        "<br>" +
        "Ticks received: " +
        ticksReceived;

      showStatus(
        "SUCCESS — LIVE DATA RECEIVED",
        true
      );

    }

  };


  ws.onerror = function(){

    showStatus(
      "WEBSOCKET ERROR",
      false
    );

    info.innerHTML =
      "The current Deriv endpoint could not be reached.";

  };


  ws.onclose = function(){

    if(ticksReceived === 0){

      showStatus(
        "CONNECTION CLOSED",
        false
      );

      info.innerHTML =
        "The current Deriv connection closed before " +
        "a live tick was received.";

    }

  };

}


connect();

</script>

</body>
</html>
