<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTRADE | Trading Tools</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#07111f;
  color:white;
  min-height:100vh;
}

header{
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1b3048;
  background:#081525;
}

.logo{
  font-size:25px;
  font-weight:bold;
  color:#35a7ff;
}

nav{
  display:flex;
  gap:20px;
}

nav a{
  color:#cbd5e1;
  text-decoration:none;
  font-size:14px;
}

nav a:hover{
  color:#35a7ff;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:50px 20px;
}

.title{
  text-align:center;
  margin-bottom:40px;
}

.title h1{
  font-size:40px;
  margin-bottom:12px;
}

.title h1 span{
  color:#35a7ff;
}

.title p{
  color:#9fb1c7;
}

.tools{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.tool{
  background:#0d1b2d;
  border:1px solid #1c3550;
  border-radius:12px;
  padding:25px;
}

.tool h3{
  color:#35a7ff;
  margin-bottom:12px;
}

.tool p{
  color:#9fb1c7;
  line-height:1.6;
  margin-bottom:20px;
}

.tool button{
  border:none;
  padding:11px 18px;
  border-radius:7px;
  background:#35a7ff;
  color:#06101c;
  font-weight:bold;
  cursor:pointer;
}

.tool button:hover{
  background:#64bcff;
}

footer{
  text-align:center;
  padding:50px 20px 30px;
  color:#71849b;
  font-size:13px;
}

@media(max-width:600px){

  header{
    padding:16px;
  }

  .logo{
    font-size:21px;
  }

  nav{
    gap:10px;
  }

  nav a{
    font-size:12px;
  }

  .title h1{
    font-size:32px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">NEXTRADE
