<script>

/* =========================
   NEXTRADE MARKET ENGINE
========================= */

const WS_URL =
  "wss://ws.binaryws.com/websockets/v3";


const markets = [
  {
    symbol:"1HZ100V",
    name:"Volatility 100 (1s)"
  },
  {
    symbol:"1HZ75V",
    name:"Volatility 75 (1s)"
  },
  {
    symbol:"1HZ50V",
    name:"Volatility 50 (1s)"
  },
  {
    symbol:"1HZ25V",
    name:"Volatility 25 (1s)"
  },
  {
    symbol:"1HZ10V",
    name:"Volatility 10 (1s)"
  },
  {
    symbol:"R_100",
    name:"Volatility 100"
  },
  {
    symbol:"R_75",
    name:"Volatility 75"
  },
  {
    symbol:"R_50",
    name:"Volatility 50"
  },
  {
    symbol:"R_25",
    name:"Volatility 25"
  },
  {
    symbol:"R_10",
    name:"Volatility 10"
  }
];


let socket = null;

let selectedSymbol = "1HZ100V";

let selectedName =
  "Volatility 100 (1s)";

let tickCount = 0;

let previousPrice = null;

let candles = [];

let currentCandle = null;

let reconnectTimer = null;


/* =========================
   ELEMENTS
========================= */

const livePrice =
  document.getElementById("livePrice");

const changeText =
  document.getElementById("changeText");

const tickCounter =
  document.getElementById("tickCount");

const streamStatus =
  document.getElementById("streamStatus");

const connectionText =
  document.getElementById("connectionText");

const connectionDot =
  document.getElementById("connectionDot");

const chartStatus =
  document.getElementById("chartStatus");

const errorBox =
  document.getElementById("errorBox");

const selectedNameElement =
  document.getElementById("selectedName");

const selectedSymbolElement =
  document.getElementById("selectedSymbol");

const infoMarket =
  document.getElementById("infoMarket");

const canvas =
  document.getElementById("chart");

const ctx =
  canvas.getContext("2d");


/* =========================
   CANVAS
========================= */

function resizeCanvas(){

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  drawChart();

}


/* =========================
   CONNECTION
========================= */

function connect(){

  clearTimeout(reconnectTimer);

  connectionText.textContent =
    "CONNECTING";

  connectionDot.className =
    "connection-dot";

  streamStatus.textContent =
    "Connecting...";

  chartStatus.textContent =
    "Connecting to Deriv...";


  try{

    socket =
      new WebSocket(WS_URL);

  }catch(error){

    showError(
      "Unable to create WebSocket: " +
      error.message
    );

    reconnect();

    return;

  }


  socket.onopen =
    function(){

      connectionText.textContent =
        "CONNECTED";

      connectionDot.className =
        "connection-dot good";

      streamStatus.textContent =
        "Live";

      hideError();


      /*
        Request historical ticks first.
        Then subscribe to live ticks.
      */

      socket.send(
        JSON.stringify({

          ticks_history:
            selectedSymbol,

          end:"latest",

          count:100,

          style:"ticks",

          req_id:100

        })
      );


      socket.send(
        JSON.stringify({

          ticks:
            selectedSymbol,

          subscribe:1,

          req_id:101

        })
      );

    };


  socket.onmessage =
    function(event){

      let data;

      try{

        data =
          JSON.parse(event.data);

      }catch(error){

        return;

      }


      /* DERIV ERROR */

      if(data.error){

        showError(
          "Deriv error: " +
          (
            data.error.code || ""
          ) +
          " — " +
          (
            data.error.message ||
            "Unknown error"
          )
        );

        streamStatus.textContent =
          "Error";

        chartStatus.textContent =
          "Market data error";

        return;

      }


      /* HISTORICAL DATA */

      if(data.msg_type === "history"){

        buildHistoricalCandles(
          data.history
        );

        chartStatus.textContent =
          "Historical data loaded";

        return;

      }


      /* LIVE TICK */

      if(data.msg_type === "tick"){

        const price =
          Number(data.tick.quote);

        const epoch =
          Number(data.tick.epoch);


        tickCount++;

        tickCounter.textContent =
          tickCount;


        livePrice.textContent =
          formatPrice(price);


        updateMiniPrice(
          selectedSymbol,
          price
        );


        updateMovement(
          price
        );


        updateCandle(
          price,
          epoch
        );


        streamStatus.textContent =
          "Receiving";

        chartStatus.textContent =
          "LIVE • 1 SECOND TICKS";

      }

    };


  socket.onerror =
    function(){

      connectionText.textContent =
        "CONNECTION ERROR";

      connectionDot.className =
        "connection-dot bad";

      streamStatus.textContent =
        "Connection error";

    };


  socket.onclose =
    function(){

      connectionText.textContent =
        "DISCONNECTED";

      connectionDot.className =
        "connection-dot bad";

      streamStatus.textContent =
        "Reconnecting...";

      chartStatus.textContent =
        "Connection closed";

      reconnect();

    };

}


/* =========================
   RECONNECT
========================= */

function reconnect(){

  clearTimeout(
    reconnectTimer
  );

  reconnectTimer =
    setTimeout(
      connect,
      3000
    );

}


/* =========================
   HISTORICAL CANDLES
========================= */

function buildHistoricalCandles(history){

  candles = [];

  currentCandle = null;

  if(
    !history ||
    !history.prices ||
    !history.times
  ){

    drawChart();

    return;

  }


  const prices =
    history.prices;

  const times =
    history.times;


  /*
    Convert historical ticks into
    1-second candles.
  */

  for(
    let i=0;
    i<prices.length;
    i++
  ){

    const price =
      Number(prices[i]);

    const time =
      Number(times[i]);


    addHistoricalTick(
      price,
      time
    );

  }


  if(currentCandle){

    candles.push(
      currentCandle
    );

    currentCandle =
      null;

  }


  if(candles.length > 120){

    candles =
      candles.slice(-120);

  }


  drawChart();

}


/* =========================
   HISTORICAL TICK → CANDLE
========================= */

function addHistoricalTick(
  price,
  epoch
){

  const second =
    Math.floor(epoch);


  if(
    !currentCandle ||
    currentCandle.time !== second
  ){

    if(currentCandle){

      candles.push(
        currentCandle
      );

    }


    currentCandle = {

      time:second,

      open:price,

      high:price,

      low:price,

      close:price

    };

  }else{

    currentCandle.high =
      Math.max(
        currentCandle.high,
        price
      );

    currentCandle.low =
      Math.min(
        currentCandle.low,
        price
      );

    currentCandle.close =
      price;

  }

}


/* =========================
   LIVE CANDLE
========================= */

function updateCandle(
  price,
  epoch
){

  const second =
    Math.floor(epoch);


  if(
    !currentCandle ||
    currentCandle.time !== second
  ){

    if(currentCandle){

      candles.push(
        currentCandle
      );

    }


    currentCandle = {

      time:second,

      open:price,

      high:price,

      low:price,

      close:price

    };


    if(candles.length > 120){

      candles.shift();

    }

  }else{

    currentCandle.high =
      Math.max(
        currentCandle.high,
        price
      );

    currentCandle.low =
      Math.min(
        currentCandle.low,
        price
      );

    currentCandle.close =
      price;

  }


  drawChart();

}


/* =========================
   DRAW CHART
========================= */

function drawChart(){

  const width =
    canvas.clientWidth;

  const height =
    canvas.clientHeight;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  let data =
    candles.slice();


  if(currentCandle){

    data.push(
      currentCandle
    );

  }


  if(data.length < 2){

    drawWaiting(
      width,
      height
    );

    return;

  }


  let min =
    Math.min(
      ...data.map(
        c => c.low
      )
    );

  let max =
    Math.max(
      ...data.map(
        c => c.high
      )
    );


  if(max === min){

    max += 1;

    min -= 1;

  }


  const padding =
    35;

  const chartHeight =
    height -
    padding * 2;

  const chartWidth =
    width -
    padding * 2;


  const spacing =
    chartWidth /
    data.length;


  const candleWidth =
    Math.max(
      3,
      spacing * .58
    );


  function y(value){

    return (
      height -
      padding -
      (
        (value-min) /
        (max-min)
      ) *
      chartHeight
    );

  }


  data.forEach(
    (candle,index)=>{

      const x =
        padding +
        index * spacing +
        spacing / 2;


      const openY =
        y(candle.open);

      const closeY =
        y(candle.close);

      const highY =
        y(candle.high);

      const lowY =
        y(candle.low);


      const bullish =
        candle.close >=
        candle.open;


      const bodyColor =
        bullish
        ? "#2edb9c"
        : "#ff5d6c";


      /* WICK */

      ctx.strokeStyle =
        bodyColor;

      ctx.lineWidth =
        1;


      ctx.beginPath();

      ctx.moveTo(
        x,
        highY
      );

      ctx.lineTo(
        x,
        lowY
      );

      ctx.stroke();


      /* BODY */

      ctx.fillStyle =
        bodyColor;


      const top =
        Math.min(
          openY,
          closeY
        );


      const bodyHeight =
        Math.max(
          2,
          Math.abs(
            closeY -
            openY
          )
        );


      ctx.fillRect(
        x -
        candleWidth/2,

        top,

        candleWidth,

        bodyHeight
      );

    }
  );

}


/* =========================
   WAITING CHART
========================= */

function drawWaiting(
  width,
  height
){

  ctx.fillStyle =
    "#61798b";

  ctx.font =
    "12px Arial";

  ctx.textAlign =
    "center";

  ctx.fillText(
    "Waiting for live market data...",
    width/2,
    height/2
  );

}


/* =========================
   PRICE FORMAT
========================= */

function formatPrice(
  price
){

  if(
    !Number.isFinite(price)
  ){

    return "---";

  }


  return price.toLocaleString(
    undefined,
    {
      minimumFractionDigits:2,
      maximumFractionDigits:8
    }
  );

}


/* =========================
   MOVEMENT
========================= */

function updateMovement(
  price
){

  if(previousPrice === null){

    changeText.textContent =
      "Live market price";

    previousPrice =
      price;

    return;

  }


  if(price > previousPrice){

    changeText.textContent =
      "▲ Price moving higher";

    changeText.style.color =
      "#2edb9c";

  }

  else if(price < previousPrice){

    changeText.textContent =
      "▼ Price moving lower";

    changeText.style.color =
      "#ff5d6c";

  }

  else{

    changeText.textContent =
      "● Price unchanged";

    changeText.style.color =
      "#71889b";

  }


  previousPrice =
    price;

}


/* =========================
   MINI PRICES
========================= */

function updateMiniPrice(
  symbol,
  price
){

  const element =
    document.getElementById(
      "p-" + symbol
    );


  if(element){

    element.textContent =
      formatPrice(price);

  }

}


/* =========================
   MARKET SWITCH
========================= */

document
.querySelectorAll(".market")
.forEach(
  button=>{

    button.addEventListener(
      "click",
      function(){

        const symbol =
          this.dataset.symbol;

        const name =
          this.dataset.name;


        if(
          symbol ===
          selectedSymbol
        ){

          return;

        }


        document
        .querySelectorAll(".market")
        .forEach(
          b=>b.classList.remove(
            "active"
          )
        );


        this.classList.add(
          "active"
        );


        selectedSymbol =
          symbol;

        selectedName =
          name;


        selectedNameElement.textContent =
          name;

        selectedSymbolElement.textContent =
          symbol;

        infoMarket.textContent =
          name;


        livePrice.textContent =
          "---";

        changeText.textContent =
          "Waiting for market data...";

        tickCount = 0;

        tickCounter.textContent =
          "0";

        previousPrice =
          null;


        candles = [];

        currentCandle =
          null;


        hideError();

        chartStatus.textContent =
          "Switching market...";


        /*
          Reconnect so the old
          subscription is replaced.
        */

        if(socket){

          socket.close();

        }else{

          connect();

        }

      }
    );

  }
);


/* =========================
   ERRORS
========================= */

function showError(message){

  errorBox.style.display =
    "block";

  errorBox.textContent =
    message;

}


function hideError(){

  errorBox.style.display =
    "none";

}


/* =========================
   START
========================= */

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();

connect();

</script>
