<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NEXTRADE | Live Markets</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#040a10;
color:#fff;
min-height:100vh;
}

header{
height:72px;
background:#08131f;
border-bottom:1px solid #193247;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%;
}

.logo{
font-size:24px;
font-weight:900;
}

.logo span{
color:#159ff0;
}

.nav{
display:flex;
gap:20px;
align-items:center;
}

.nav a{
color:#8aa0b0;
text-decoration:none;
font-size:10px;
font-weight:bold;
}

.nav a:hover{
color:#159ff0;
}

.account{
background:#07111b;
border:1px solid #193247;
border-radius:8px;
padding:9px 12px;
font-size:9px;
}

.account-dot{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#777;
margin-right:5px;
}

.account-dot.live{
background:#2edb9c;
box-shadow:0 0 8px #2edb9c;
}

main{
padding:25px 5%;
}

.page-title{
margin-bottom:20px;
}

.page-title h1{
font-size:28px;
margin-bottom:7px;
}

.page-title p{
font-size:11px;
color:#71899a;
}

/* ACCOUNT */

.account-panel{
background:#08131f;
border:1px solid #193247;
border-radius:12px;
padding:18px;
margin-bottom:22px;
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
}

.account-left{
display:flex;
align-items:center;
gap:14px;
}

.account-icon{
width:45px;
height:45px;
border-radius:50%;
background:#159ff0;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.account-title{
font-size:13px;
font-weight:bold;
margin-bottom:5px;
}

.account-status{
font-size:9px;
color:#71899a;
}

.account-right{
text-align:right;
}

.balance-label{
font-size:8px;
color:#71899a;
margin-bottom:4px;
}

.balance{
font-size:20px;
font-weight:bold;
}

.logout{
border:1px solid #28465a;
background:transparent;
color:#8aa0b0;
border-radius:6px;
padding:8px 12px;
font-size:8px;
cursor:pointer;
margin-top:8px;
}

.logout:hover{
border-color:#159ff0;
color:#fff;
}

/* LAYOUT */

.market-layout{
display:grid;
grid-template-columns:300px 1fr;
gap:20px;
}

/* MARKET LIST */

.market-list{
background:#08131f;
border:1px solid #193247;
border-radius:12px;
overflow:hidden;
}

.list-title{
padding:15px;
border-bottom:1px solid #193247;
font-size:10px;
font-weight:bold;
color:#159ff0;
}

.market{
padding:14px;
border-bottom:1px solid #122638;
cursor:pointer;
transition:.2s;
}

.market:hover{
background:#0b1b29;
}

.market.active{
background:#0c2030;
border-left:3px solid #159ff0;
}

.market-name{
font-size:10px;
font-weight:bold;
margin-bottom:5px;
}

.market-symbol{
font-size:8px;
color:#617889;
}

.market-price{
font-size:12px;
font-weight:bold;
margin-top:7px;
}

/* CHART */

.chart-card{
background:#08131f;
border:1px solid #193247;
border-radius:12px;
padding:20px;
min-height:520px;
}

.chart-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.selected-name{
font-size:15px;
font-weight:bold;
}

.selected-symbol{
font-size:9px;
color:#71899a;
margin-top:5px;
}

.live-badge{
font-size:8px;
color:#2edb9c;
}

.live-badge span{
display:inline-block;
width:7px;
height:7px;
border-radius:50%;
background:#2edb9c;
margin-right:5px;
}

.price-box{
margin-bottom:15px;
}

.live-price{
font-size:30px;
font-weight:bold;
}

.price-caption{
font-size:8px;
color:#71899a;
margin-top:4px;
}

canvas{
width:100%;
height:330px;
background:#050c13;
border:1px solid #142a3b;
border-radius:8px;
}

.timeframes{
display:flex;
gap:7px;
margin-top:15px;
}

.timeframes button{
background:#07111b;
border:1px solid #193247;
color:#71899a;
padding:8px 12px;
border-radius:5px;
font-size:8px;
cursor:pointer;
}

.timeframes button.active{
background:#159ff0;
border-color:#159ff0;
color:#fff;
}

.message{
margin-top:15px;
padding:10px;
border-radius:7px;
background:#07131d;
border:1px solid #193247;
font-size:8px;
color:#71899a;
}

@media(max-width:800px){

.market-layout{
grid-template-columns:1fr;
}

.market-list{
order:2;
}

.chart-card{
order:1;
}

.account-panel{
align-items:flex-start;
flex-direction:column;
}

.account-right{
text-align:left;
}

.nav{
gap:10px;
}

}

</style>
</head>

<body>

<header>

<div class="logo">
NEX<span>TRADE</span>
</div>

<div class="nav">

<a href="index.html">
HOME
</a>

<a href="tools.html">
TOOLS
</a>

<div class="account">
<span
id="headerDot"
class="account-dot"
></span>

<span id="headerStatus">
CHECKING
</span>
</div>

</div>

</header>

<main>

<div class="page-title">

<h1>
Live Markets
</h1>

<p>
Monitor live Deriv volatility markets in real time.
</p>

</div>


<!-- ACCOUNT PANEL -->

<div class="account-panel">

<div class="account-left">

<div class="account-icon">
D
</div>

<div>

<div class="account-title">
Deriv Account
</div>

<div
id="accountStatus"
class="account-status"
>
Checking authentication...
</div>

</div>

</div>


<div class="account-right">

<div class="balance-label">
BALANCE
</div>

<div
id="balance"
class="balance"
>
--
</div>

<button
id="logout"
class="logout"
>
LOG OUT
</button>

</div>

</div>


<div class="market-layout">


<!-- MARKET LIST -->

<div class="market-list">

<div class="list-title">
VOLATILITY MARKETS
</div>

<div id="marketList"></div>

</div>


<!-- CHART -->

<div class="chart-card">

<div class="chart-header">

<div>

<div
id="selectedName"
class="selected-name"
>
Volatility 100 (1s)
</div>

<div
id="selectedSymbol"
class="selected-symbol"
>
1HZ100V
</div>

</div>

<div class="live-badge">

<span></span>
LIVE

</div>

</div>


<div class="price-box">

<div
id="livePrice"
class="live-price"
>
--
</div>

<div class="price-caption">
LIVE • RECEIVING MARKET DATA
</div>

</div>


<canvas
id="chart"
></canvas>


<div class="timeframes">

<button class="active">
1S
</button>

<button>
5S
</button>

<button>
15S
</button>

<button>
30S
</button>

<button>
1M
</button>

</div>


<div
id="message"
class="message"
>
Connecting to NEXTRADE live market data...
</div>

</div>

</div>

</main>


<script>

/*
 * Your Render backend
 */
const BACKEND =
"https://nextrade-backened.onrender.com";


/*
 * Ten markets
 */
const markets = [

{
name:"Volatility 100 (1s)",
symbol:"1HZ100V"
},

{
name:"Volatility 75 (1s)",
symbol:"1HZ75V"
},

{
name:"Volatility 50 (1s)",
symbol:"1HZ50V"
},

{
name:"Volatility 25 (1s)",
symbol:"1HZ25V"
},

{
name:"Volatility 10 (1s)",
symbol:"1HZ10V"
},

{
name:"Volatility 100",
symbol:"R_100"
},

{
name:"Volatility 75",
symbol:"R_75"
},

{
name:"Volatility 50",
symbol:"R_50"
},

{
name:"Volatility 25",
symbol:"R_25"
},

{
name:"Volatility 10",
symbol:"R_10"
}

];


const prices = {};
const history = {};

let selected =
"1HZ100V";


/*
 * Elements
 */

const marketList =
document.getElementById(
"marketList"
);

const livePrice =
document.getElementById(
"livePrice"
);

const selectedName =
document.getElementById(
"selectedName"
);

const selectedSymbol =
document.getElementById(
"selectedSymbol"
);

const message =
document.getElementById(
"message"
);


/*
 * Create market list
 */

markets.forEach(
market => {

history[market.symbol] = [];

const div =
document.createElement("div");

div.className =
"market";

if (
market.symbol === selected
) {

div.classList.add(
"active"
);

}

div.innerHTML = `

<div class="market-name">
${market.name}
</div>

<div class="market-symbol">
${market.symbol}
</div>

<div
class="market-price"
id="price-${market.symbol}"
>
--
</div>

`;

div.addEventListener(
"click",
() => {

selected =
market.symbol;

selectedName.textContent =
market.name;

selectedSymbol.textContent =
market.symbol;

document
.querySelectorAll(
".market"
)
.forEach(
item =>
item.classList.remove(
"active"
)
);

div.classList.add(
"active"
);

updateSelectedPrice();

drawChart();

});

marketList.appendChild(
div
);

});


/*
 * Update selected price
 */

function updateSelectedPrice(){

const price =
prices[selected];

if (
price !== undefined
){

livePrice.textContent =
formatPrice(price);

}

}


/*
 * Format prices
 */

function formatPrice(
value
){

return Number(
value
).toLocaleString(
"en-US",
{
maximumFractionDigits:8
}
);

}


/*
 * Canvas
 */

const canvas =
document.getElementById(
"chart"
);

const ctx =
canvas.getContext("2d");


function resizeCanvas(){

const rect =
canvas.getBoundingClientRect();

canvas.width =
rect.width *
window.devicePixelRatio;

canvas.height =
rect.height *
window.devicePixelRatio;

ctx.scale(
window.devicePixelRatio,
window.devicePixelRatio
);

drawChart();

}


function drawChart(){

const width =
canvas.clientWidth;

const height =
canvas.clientHeight;

ctx.clearRect(
0,
0,
width,
height
);

const data =
history[selected] || [];

if (
data.length < 2
){

ctx.fillStyle =
"#71899a";

ctx.font =
"11px Arial";

ctx.textAlign =
"center";

ctx.fillText(
"Waiting for live price data...",
width / 2,
height / 2
);

return;

}


const values =
data.map(
item => item.price
);

const min =
Math.min(...values);

const max =
Math.max(...values);

const range =
max - min || 1;


/*
 * Grid
 */

ctx.strokeStyle =
"#102535";

ctx.lineWidth =
1;

for (
let i=1;
i<5;
i++
){

const y =
(i/5)*height;

ctx.beginPath();

ctx.moveTo(
0,
y
);

ctx.lineTo(
width,
y
);

ctx.stroke();

}


/*
 * Price line
 */

ctx.strokeStyle =
"#159ff0";

ctx.lineWidth =
2;

ctx.beginPath();

data.forEach(
(item,index) => {

const x =
(index /
(data.length-1))
* width;

const y =
height -
(
(item.price-min) /
range
) *
(height-20)
-10;

if(index===0){

ctx.moveTo(
x,
y
);

}else{

ctx.lineTo(
x,
y
);

}

});

ctx.stroke();

}


window.addEventListener(
"resize",
resizeCanvas
);

resizeCanvas();


/*
 * WebSocket
 */

let socket;


function connect(){

message.textContent =
"Connecting to live market data...";

socket =
new WebSocket(
BACKEND
.replace(
"https://",
"wss://"
)
);


socket.onopen =
() => {

message.textContent =
"LIVE • Receiving market data";

};


socket.onmessage =
event => {

try{

const msg =
JSON.parse(
event.data
);

if(
msg.type === "tick" &&
msg.data
){

const symbol =
msg.data.symbol;

const price =
Number(
msg.data.price
);

prices[symbol] =
price;

if(
!history[symbol]
){

history[symbol] = [];

}

history[symbol].push({
price,
epoch:
msg.data.epoch
});


if(
history[symbol].length >
100
){

history[symbol].shift();

}


const priceElement =
document.getElementById(
`price-${symbol}`
);

if(
priceElement
){

priceElement.textContent =
formatPrice(price);

}


if(
symbol === selected
){

updateSelectedPrice();

drawChart();

}

}

}catch(error){

console.error(
"WebSocket message error:",
error
);

}

};


socket.onclose =
() => {

message.textContent =
"Connection closed — reconnecting...";

setTimeout(
connect,
3000
);

};


socket.onerror =
() => {

message.textContent =
"Live connection error — reconnecting...";

};

}


connect();


/*
 * Account authentication
 */

async function loadAccount(){

const accountStatus =
document.getElementById(
"accountStatus"
);

const balance =
document.getElementById(
"balance"
);

const headerStatus =
document.getElementById(
"headerStatus"
);

const headerDot =
document.getElementById(
"headerDot"
);

try{

/*
 * Check session.
 */

const sessionResponse =
await fetch(
`${BACKEND}/api/session`,
{
credentials:"include"
}
);

const session =
await sessionResponse.json();


if(
!session.authenticated
){

accountStatus.textContent =
"Not connected";

headerStatus.textContent =
"NOT CONNECTED";

return;

}


/*
 * Authenticated.
 */

accountStatus.textContent =
"Deriv account connected";

headerStatus.textContent =
"CONNECTED";

headerDot.classList.add(
"live"
);


/*
 * Request account data.
 */

const accountResponse =
await fetch(
`${BACKEND}/api/accounts`,
{
credentials:"include"
}
);

const data =
await accountResponse.json();


console.log(
"Deriv account response:",
data
);


/*
 * Different Deriv API versions can
 * return slightly different structures.
 *
 * We therefore search common balance
 * fields instead of assuming one format.
 */

let foundBalance = null;


function searchBalance(
object
){

if(
!object ||
typeof object !==
"object"
){

return null;

}

if(
typeof object.balance ===
"number"
){

return object.balance;

}

if(
typeof object.balance ===
"string"
&&
!isNaN(
Number(object.balance)
)
){

return Number(
object.balance
);

}


for(
const key in object
){

const result =
searchBalance(
object[key]
);

if(
result !== null
){

return result;

}

}

return null;

}


foundBalance =
searchBalance(
data
);


if(
foundBalance !== null
){

balance.textContent =
foundBalance.toLocaleString(
"en-US",
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
);

}else{

balance.textContent =
"--";

accountStatus.textContent =
"Deriv connected • account data available";

}

}catch(error){

console.error(
"Account loading error:",
error
);

accountStatus.textContent =
"Connected, but account information could not be loaded.";

}

}


loadAccount();


/*
 * Logout
 */

document
.getElementById("logout")
.addEventListener(
"click",
async () => {

try{

await fetch(
`${BACKEND}/api/logout`,
{
method:"POST",
credentials:"include"
}
);

window.location.href =
"login.html";

}catch(error){

console.error(
"Logout error:",
error
);

}

});


</script>

</body>
