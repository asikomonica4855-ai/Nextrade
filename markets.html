<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTRADE | Live Markets</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#050b12;
color:#fff;
min-height:100vh;
}

header{
height:70px;
background:#08131f;
border-bottom:1px solid #193247;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 5%;
}

.logo{
font-size:25px;
font-weight:800;
}

.logo span{
color:#159ff0;
}

.nav{
display:flex;
gap:8px;
}

.nav a{
text-decoration:none;
font-size:12px;
padding:10px 14px;
}

.login{
color:#fff;
}

.signup{
background:#159ff0;
color:white;
border-radius:7px;
font-weight:bold;
}

.page{
width:92%;
max-width:1400px;
margin:auto;
padding:28px 0;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.top h1{
font-size:29px;
}

.top p{
color:#71889b;
font-size:12px;
margin-top:6px;
}

.connection{
display:flex;
align-items:center;
gap:8px;
font-size:10px;
color:#8298a9;
}

.dot{
width:9px;
height:9px;
border-radius:50%;
background:#f0ad28;
}

.dot.live{
background:#2edb9c;
box-shadow:0 0 10px #2edb9c;
}

.dot.error{
background:#ff5969;
}

.layout{
display:grid;
grid-template-columns:260px 1fr;
gap:18px;
}

.sidebar{
background:#08131f;
border:1px solid #193247;
border-radius:12px;
overflow:hidden;
}

.sidebar-title{
padding:17px;
font-size:10px;
font-weight:bold;
letter-spacing:1px;
color:#72899b;
border-bottom:1px solid #193247;
}

.market{
width:100%;
padding:15px;
background:transparent;
border:0;
border-bottom:1px solid #142a3b;
color:white;
text-align:left;
cursor:pointer;
position:relative;
}

.market:hover,
.market.active{
background:#0c263b;
}

.market.active{
border-left:3px solid #159ff0;
padding-left:12px;
}

.market-name{
display:block;
font-size:12px;
font-weight:bold;
}

.market-symbol{
display:block;
font-size:9px;
color:#61798b;
margin-top:5px;
}

.market-price{
position:absolute;
right:14px;
top:21px;
font-size:10px;
color:#9db2c0;
}

.panel{
background:#08131f;
border:1px solid #193247;
border-radius:12px;
overflow:hidden;
}

.panel-head{
padding:18px;
border-bottom:1px solid #193247;
display:flex;
justify-content:space-between;
align-items:center;
}

.selected-name{
font-size:16px;
font-weight:bold;
}

.selected-symbol{
font-size:10px;
color:#657e91;
margin-top:5px;
}

.live-label{
font-size:10px;
color:#2edb9c;
}

.price-area{
padding:20px;
background:#060e16;
border-bottom:1px solid #193247;
}

.price-label{
font-size:9px;
color:#60788a;
margin-bottom:7px;
}

.price{
font-size:35px;
font-weight:bold;
}

.price-status{
font-size:10px;
color:#71899a;
margin-top:6px;
}

.chart-toolbar{
height:50px;
background:#07121d;
border-bottom:1px solid #193247;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 14px;
}

.timeframes{
display:flex;
gap:5px;
}

.timeframe{
border:1px solid #193247;
background:#091724;
color:#7890a2;
padding:6px 9px;
border-radius:5px;
font-size:9px;
cursor:pointer;
}

.timeframe.active{
background:#159ff0;
border-color:#159ff0;
color:white;
}

.chart-tools{
display:flex;
gap:6px;
}

.chart-tool{
border:1px solid #193247;
background:#091724;
color:#7890a2;
padding:6px 9px;
border-radius:5px;
font-size:9px;
cursor:pointer;
}

.chart-tool:hover{
background:#0c263b;
color:white;
}

.chart-wrapper{
height:520px;
display:flex;
background:#050d15;
}

.chart-area{
position:relative;
flex:1;
overflow:hidden;
background:
linear-gradient(rgba(30,65,90,.13) 1px,transparent 1px),
linear-gradient(90deg,rgba(30,65,90,.13) 1px,transparent 1px),
#050d15;
background-size:45px 45px;
touch-action:none;
}

#chart{
width:100%;
height:100%;
display:block;
}

.price-scale{
width:82px;
background:#07121d;
border-left:1px solid #193247;
position:relative;
overflow:hidden;
}

.scale-label{
position:absolute;
right:8px;
font-size:9px;
color:#71899a;
transform:translateY(-50%);
white-space:nowrap;
}

.current-price-label{
position:absolute;
right:0;
background:#159ff0;
color:white;
font-size:9px;
padding:4px 6px;
border-radius:3px 0 0 3px;
z-index:5;
}

.crosshair-label{
position:absolute;
right:0;
background:#263746;
color:#fff;
font-size:9px;
padding:4px 6px;
display:none;
z-index:6;
}

.chart-status{
position:absolute;
top:12px;
left:12px;
padding:7px 9px;
background:rgba(5,13,21,.92);
border:1px solid #1c3c54;
border-radius:5px;
font-size:9px;
color:#7890a2;
z-index:4;
}

.crosshair-v,
.crosshair-h{
position:absolute;
display:none;
pointer-events:none;
z-index:3;
}

.crosshair-v{
top:0;
bottom:0;
width:1px;
background:rgba(255,255,255,.25);
}

.crosshair-h{
left:0;
right:0;
height:1px;
background:rgba(255,255,255,.25);
}

.info{
display:grid;
grid-template-columns:repeat(3,1fr);
border-top:1px solid #193247;
}

.info-box{
padding:16px;
border-right:1px solid #193247;
}

.info-box:last-child{
border-right:0;
}

.info-label{
font-size:9px;
color:#60788a;
margin-bottom:6px;
}

.info-value{
font-size:13px;
font-weight:bold;
}

.error{
display:none;
margin-top:12px;
padding:13px;
border-radius:7px;
background:#28151a;
border:1px solid #66313b;
color:#ff7c88;
font-size:11px;
}

@media(max-width:800px){

.layout{
grid-template-columns:1fr;
}

.sidebar{
display:grid;
grid-template-columns:repeat(2,1fr);
}

.sidebar-title{
grid-column:1/-1;
}

.top{
align-items:flex-start;
flex-direction:column;
gap:12px;
}

.chart-wrapper{
height:430px;
}

}

@media(max-width:500px){

.page{
width:94%;
}

.chart-toolbar{
overflow-x:auto;
justify-content:flex-start;
gap:12px;
}

.chart-tools{
display:none;
}

.chart-wrapper{
height:380px;
}

.price-scale{
width:65px;
}

.info{
grid-template-columns:1fr;
}

.info-box{
border-right:0;
border-bottom:1px solid #193247;
}

}
</style>
</head>

<script>

const BACKEND =
"wss://nextrade-backened.onrender.com";

let ws;

let selectedSymbol = "1HZ100V";

let selectedName = "Volatility 100 (1s)";

let tickCount = 0;

let timeframeSeconds = 1;

let candles = [];

let currentCandle = null;

let zoomLevel = 1;

let panOffset = 0;

let crosshairEnabled = true;


/* ELEMENTS */

const connection =
document.getElementById("connection");

const dot =
document.getElementById("dot");

const livePrice =
document.getElementById("livePrice");

const priceStatus =
document.getElementById("priceStatus");

const chartStatus =
document.getElementById("chartStatus");

const backend =
document.getElementById("backend");

const ticks =
document.getElementById("ticks");

const errorBox =
document.getElementById("error");

const canvas =
document.getElementById("chart");

const ctx =
canvas.getContext("2d");

const chartArea =
document.getElementById("chartArea");

const priceScale =
document.getElementById("priceScale");

const crossV =
document.getElementById("crossV");

const crossH =
document.getElementById("crossH");


/* BACKEND */

function connectBackend(){

connection.textContent = "CONNECTING";

dot.className = "dot";

backend.textContent = "Connecting...";

chartStatus.textContent =
"Connecting to NEXTRADE backend...";

try{

ws = new WebSocket(BACKEND);

}catch(error){

showError("Could not create WebSocket.");

return;

}


ws.onopen = function(){

connection.textContent = "CONNECTED";

dot.className = "dot live";

backend.textContent =
"Backend connected";

chartStatus.textContent =
"Waiting for live data...";

hideError();

};


ws.onmessage = function(event){

let data;

try{

data = JSON.parse(event.data);

}catch(error){

return;

}


if(data.type === "status"){

if(data.connected){

connection.textContent = "LIVE";

dot.className = "dot live";

backend.textContent = "Deriv LIVE";

chartStatus.textContent =
"LIVE • Receiving market data";

}else{

backend.textContent =
"Waiting for Deriv";

}

return;

}


if(data.type === "deriv_error"){

showError(
"Deriv error: " +
(
data.error &&
data.error.message
?
data.error.message
:
"Unknown error"
)
);

return;

}


if(data.type !== "tick"){
return;
}

const tick = data.data;

if(!tick){
return;
}


/* SIDEBAR */

const sidebarPrice =
document.getElementById(
"p-" + tick.symbol
);

if(sidebarPrice){

sidebarPrice.textContent =
formatPrice(tick.price);

}


/* SELECTED MARKET */

if(tick.symbol !== selectedSymbol){
return;
}


const price =
Number(tick.price);

const now =
Math.floor(Date.now() / 1000);

tickCount++;

ticks.textContent =
tickCount;

livePrice.textContent =
formatPrice(price);

priceStatus.textContent =
"LIVE • Receiving market data";

chartStatus.textContent =
"LIVE • REAL-TIME CANDLES";


/* CANDLE */

const candleTime =
Math.floor(
now / timeframeSeconds
) * timeframeSeconds;


if(
!currentCandle ||
currentCandle.time !== candleTime
){

if(currentCandle){

candles.push(currentCandle);

if(candles.length > 150){
candles.shift();
}

}

currentCandle = {

time:candleTime,

open:price,

high:price,

low:price,

close:price

};

}else{

currentCandle.high =
Math.max(
currentCandle.high,
price
);

currentCandle.low =
Math.min(
currentCandle.low,
price
);

currentCandle.close =
price;

}

drawChart();

};

ws.onerror = function(){

connection.textContent = "ERROR";

dot.className = "dot error";

backend.textContent =
"Connection error";

showError(
"Could not connect to the NEXTRADE backend."
);

};

ws.onclose = function(event){

connection.textContent =
"DISCONNECTED";

dot.className =
"dot error";

backend.textContent =
"Connection closed";

chartStatus.textContent =
"Backend connection closed";

showError(
"NEXTRADE backend disconnected. Code: "
+
event.code
);

};

}


/* MARKET SELECTION */

document
.querySelectorAll(".market")
.forEach(function(button){

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".market")
.forEach(function(item){

item.classList.remove("active");

});

this.classList.add("active");

selectedSymbol =
this.dataset.symbol;

selectedName =
this.dataset.name;

document.getElementById(
"selectedName"
).textContent =
selectedName;

document.getElementById(
"selectedSymbol"
).textContent =
selectedSymbol;

document.getElementById(
"marketInfo"
).textContent =
selectedName;

tickCount = 0;

ticks.textContent = "0";

livePrice.textContent = "---";

priceStatus.textContent =
"Waiting for " +
selectedName +
"...";

candles = [];

currentCandle = null;

zoomLevel = 1;

panOffset = 0;

drawChart();

});

});


/* TIMEFRAME */

document
.querySelectorAll(".timeframe")
.forEach(function(button){

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".timeframe")
.forEach(function(item){

item.classList.remove("active");

});

this.classList.add("active");

timeframeSeconds =
Number(this.dataset.seconds);

candles = [];

currentCandle = null;

zoomLevel = 1;

panOffset = 0;

drawChart();

});

});


/* RESET */

document
.getElementById("resetZoom")
.addEventListener(
"click",
function(){

zoomLevel = 1;

panOffset = 0;

drawChart();

});


/* CROSSHAIR */

document
.getElementById("crosshairButton")
.addEventListener(
"click",
function(){

crosshairEnabled =
!crosshairEnabled;

if(!crosshairEnabled){

crossV.style.display = "none";

crossH.style.display = "none";

}

});


/* FORMAT */

function formatPrice(value){

return Number(value).toLocaleString(
undefined,
{
minimumFractionDigits:2,
maximumFractionDigits:8
}
);

}


/* RESIZE */

function resizeCanvas(){

const ratio =
window.devicePixelRatio || 1;

canvas.width =
canvas.clientWidth * ratio;

canvas.height =
canvas.clientHeight * ratio;

ctx.setTransform(
ratio,
0,
0,
ratio,
0,
0
);

drawChart();

}


/* DRAW */

function drawChart(){

const width =
canvas.clientWidth;

const height =
canvas.clientHeight;

ctx.clearRect(
0,
0,
width,
height
);


let data =
candles.slice();

if(currentCandle){

data.push(currentCandle);

}


if(data.length === 0){

ctx.fillStyle =
"#60788a";

ctx.font =
"12px Arial";

ctx.textAlign =
"center";

ctx.fillText(
"Waiting for live ticks...",
width / 2,
height / 2
);

priceScale.innerHTML = "";

return;

}


/* ZOOM */

const visibleCount =
Math.max(
8,
Math.floor(
data.length / zoomLevel
)
);

let start =
Math.max(
0,
data.length -
visibleCount -
panOffset
);

let end =
Math.min(
data.length,
start + visibleCount
);

data =
data.slice(start,end);


if(data.length === 0){
return;
}


/* RANGE */

let min =
Infinity;

let max =
-Infinity;

data.forEach(function(c){

min =
Math.min(min,c.low);

max =
Math.max(max,c.high);

});


if(min === max){

min -= 1;

max += 1;

}


const paddingTop = 25;

const paddingBottom = 25;

const paddingLeft = 15;

const paddingRight = 10;

const chartHeight =
height -
paddingTop -
paddingBottom;

const chartWidth =
width -
paddingLeft -
paddingRight;


function priceToY(price){

return paddingTop +
(
(max-price) /
(max-min)
) *
chartHeight;

}


/* GRID PRICE SCALE */

priceScale.innerHTML = "";

for(let i=0;i<=6;i++){

const value =
max -
(
(max-min) *
(i/6)
);

const y =
paddingTop +
chartHeight *
(i/6);

const label =
document.createElement("div");

label.className =
"scale-label";

label.style.top =
y + "px";

label.textContent =
formatPrice(value);

priceScale.appendChild(label);

}


/* CURRENT PRICE */

if(currentCandle){

const currentY =
priceToY(
currentCandle.close
);

const currentLabel =
document.createElement("div");

currentLabel.className =
"current-price-label";

currentLabel.style.top =
Math.max(
0,
Math.min(
height-20,
currentY-10
)
)
+
"px";

currentLabel.textContent =
formatPrice(
currentCandle.close
);

priceScale.appendChild(
currentLabel
);

}


/* CANDLES */

const slot =
chartWidth /
data.length;

const candleWidth =
Math.max(
3,
Math.min(
18,
slot * 0.65
)
);


data.forEach(function(c,index){

const x =
paddingLeft +
index * slot +
slot/2;

const openY =
priceToY(c.open);

const closeY =
priceToY(c.close);

const highY =
priceToY(c.high);

const lowY =
priceToY(c.low);


/* WICK */

ctx.beginPath();

ctx.moveTo(x,highY);

ctx.lineTo(x,lowY);

ctx.strokeStyle =
c.close >= c.open
?
"#2edb9c"
:
"#ff5969";

ctx.lineWidth = 1;

ctx.stroke();


/* BODY */

const top =
Math.min(
openY,
closeY
);

const bodyHeight =
Math.max(
1,
Math.abs(
closeY-openY
)
);

ctx.fillStyle =
c.close >= c.open
?
"#2edb9c"
:
"#ff5969";

ctx.fillRect(
x-candleWidth/2,
top,
candleWidth,
bodyHeight
);

});


/* LIVE PRICE LINE */

if(currentCandle){

const y =
priceToY(
currentCandle.close
);

ctx.beginPath();

ctx.moveTo(
paddingLeft,
y
);

ctx.lineTo(
width-paddingRight,
y
);

ctx.strokeStyle =
"rgba(21,159,240,.65)";

ctx.lineWidth = 1;

ctx.setLineDash([5,5]);

ctx.stroke();

ctx.setLineDash([]);

}

}


/* CROSSHAIR */

chartArea.addEventListener(
"pointermove",
function(event){

if(!crosshairEnabled){
return;
}

const rect =
chartArea.getBoundingClientRect();

let x =
event.clientX -
rect.left;

let y =
event.clientY -
rect.top;

x =
Math.max(
0,
Math.min(
rect.width,
x
)
);

y =
Math.max(
0,
Math.min(
rect.height,
y
)
);

crossV.style.left =
x + "px";

crossH.style.top =
y + "px";

crossV.style.display =
"block";

crossH.style.display =
"block";

});


chartArea.addEventListener(
"pointerleave",
function(){

crossV.style.display =
"none";

crossH.style.display =
"none";

});


/* ZOOM WITH WHEEL */

chartArea.addEventListener(
"wheel",
function(event){

event.preventDefault();

if(event.deltaY < 0){

zoomLevel =
Math.min(
8,
zoomLevel * 1.25
);

}else{

zoomLevel =
Math.max(
1,
zoomLevel / 1.25
);

}

drawChart();

},
{passive:false}
);


/* DRAG / PAN */

let dragging = false;

let dragStartX = 0;

let dragStartPan = 0;


chartArea.addEventListener(
"pointerdown",
function(event){

dragging = true;

dragStartX =
event.clientX;

dragStartPan =
panOffset;

chartArea.setPointerCapture(
event.pointerId
);

});


chartArea.addEventListener(
"pointerup",
function(){

dragging = false;

});


chartArea.addEventListener(
"pointermove",
function(event){

if(!dragging){
return;
}

const distance =
event.clientX -
dragStartX;

const candleCount =
Math.max(
1,
candles.length
);

const pixelsPerCandle =
chartArea.clientWidth /
Math.max(
8,
Math.floor(
candleCount /
zoomLevel
)
);

panOffset =
Math.max(
0,
Math.min(
candles.length-1,
dragStartPan -
Math.round(
distance /
pixelsPerCandle
)
)
);

drawChart();

});


/* ERROR */

function showError(message){

errorBox.style.display =
"block";

errorBox.textContent =
message;

}


function hideError(){

errorBox.style.display =
"none";

}


/* START */

window.addEventListener(
"resize",
resizeCanvas
);

resizeCanvas();

connectBackend();

</script>
