<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXTRADE | Connecting</title><style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #040a10;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 35px 25px;
  text-align: center;
  background: #08131f;
  border: 1px solid #193247;
  border-radius: 14px;
  box-shadow: 0 25px 70px rgba(0,0,0,.45);
}

.logo {
  font-size: 24px;
  font-weight: 900;
  margin-bottom: 20px;
}

.logo span {
  color: #159ff0;
}

.spinner {
  width: 42px;
  height: 42px;
  margin: 0 auto 20px;
  border: 4px solid #193247;
  border-top-color: #159ff0;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

h1 {
  font-size: 21px;
  margin-bottom: 10px;
}

p {
  color: #71899a;
  font-size: 10px;
  line-height: 1.6;
}

.success {
  color: #2edb9c;
}

.error {
  color: #ff6675;
  margin-top: 15px;
}

.button {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 20px;
  border-radius: 7px;
  background: #159ff0;
  color: #fff;
  text-decoration: none;
  font-size: 10px;
  font-weight: bold;
}
</style></head><body><div class="card">  <div class="logo">
    MUK<span>HU</span>
  </div>  <div id="content"><div class="spinner"></div>

<h1>Connecting your Deriv account...</h1>

<p>
  Please wait while MUKHU completes the secure connection.
</p>

  </div></div><script>

const BACKEND =
  "https://nextrade-backened.onrender.com";

const params =
  new URLSearchParams(window.location.search);

const code =
  params.get("code");

const state =
  params.get("state");

const error =
  params.get("error");

const content =
  document.getElementById("content");

async function connectAccount() {

  if (error) {

    content.innerHTML = `
      <h1 class="error">
        Deriv authorization was cancelled
      </h1>

      <p>
        ${error}
      </p>

      <a class="button" href="login.html">
        BACK TO LOGIN
      </a>
    `;

    return;
  }

  if (!code || !state) {

    content.innerHTML = `
      <h1 class="error">
        Missing authorization data
      </h1>

      <p>
        Deriv did not return the required OAuth
        authorization information.
      </p>

      <a class="button" href="login.html">
        BACK TO LOGIN
      </a>
    `;

    return;
  }

  try {

    const response =
      await fetch(
        BACKEND +
        "/oauth/callback?code=" +
        encodeURIComponent(code) +
        "&state=" +
        encodeURIComponent(state)
      );

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.error ||
        "OAuth connection failed."
      );

    }

    content.innerHTML = `
      <h1 class="success">
        Deriv Connected Successfully
      </h1>

      <p>
        Your Deriv account has been authorized.
        You can now continue to NEXTRADE.
      </p>

      <a class="button" href="markets.html">
        OPEN MARKETS
      </a>
    `;

  } catch (err) {

    console.error(err);

    content.innerHTML = `
      <h1 class="error">
        Connection failed
      </h1>

      <p>
        ${err.message}
      </p>

      <a class="button" href="login.html">
        TRY AGAIN
      </a>
    `;

  }

}

connectAccount();

</script></body>
</html>
